<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha TV - Vídeos</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #e94560; }
        
        /* Estilo da nossa TV */
        .tela-tv {
            background-color: #000;
            border: 10px solid #16213e;
            border-radius: 15px;
            max-width: 800px;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }
        
        /* Faz o vídeo ocupar o espaço todo da TV */
        .tela-tv iframe {
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 5px;
        }
        
        .voltar {
            color: white;
            text-decoration: none;
            background-color: #16213e;
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>📺 Minha TV de Vídeos 📺</h1>
    
    <div class="tela-tv">
        <!-- Aqui está o vídeo do YouTube. Para trocar, mude o link do src -->
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
    </div>

    <h3>Quer assistir no TikTok?</h3>
    <a href="https://www.tiktok.com/" target="_blank" style="background-color: #00f2fe; color: black; padding: 10px 20px; text-decoration: none; border-radius: 10px; font-weight: bold;">Abrir TikTok</a>

    <br><br>
    <a href="index.html" class="voltar">⬅ Voltar para o Portal</a>

</body>
</html>
