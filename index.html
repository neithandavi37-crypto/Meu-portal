<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portal de Jogos</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #e94560;
        }
        .grade-jogos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }
        .cartao-jogo {
            background-color: #16213e;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            transition: transform 0.2s;
            border: 2px solid transparent;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 160px;
        }
        .cartao-jogo:hover {
            transform: scale(1.05);
            border: 2px solid #e94560;
        }
        .icone-jogo {
            font-size: 60px;
            margin-bottom: 10px;
        }
        .cartao-jogo h3 {
            margin: 0;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>🎮 Meu Portal de Jogos 🎮</h1>
    
    <div class="grade-jogos">
        
        <!-- Jogo 1 -->
        <a href="https://play2048.co/" target="_blank" class="cartao-jogo">
            <div class="icone-jogo">🔢</div>
            <h3>2048</h3>
        </a>

        <!-- Jogo 2 -->
        <a href="https://www.google.com/logos/2010/pacman10-i.html" target="_blank" class="cartao-jogo">
            <div class="icone-jogo">🟡</div>
            <h3>Pac-Man</h3>
        </a>

        <!-- Jogo 3 -->
        <a href="https://playsnake.org/" target="_blank" class="cartao-jogo">
            <div class="icone-jogo">🐍</div>
            <h3>Snake</h3>
        </a>

        <!-- Jogo 4 -->
        <a href="https://trex-runner.com/" target="_blank" class="cartao-jogo">
            <div class="icone-jogo">🦖</div>
            <h3>T-Rex Run</h3>
        </a>

        <!-- Jogo 5 -->
        <a href="https://flappybird.io/" target="_blank" class="cartao-jogo">
            <div class="icone-jogo">🐦</div>
            <h3>Flappy Bird</h3>
        </a>

        <!-- Jogo 6 -->
        <a href="https://play.tetris.com/" target="_blank" class="cartao-jogo">
            <div class="icone-jogo">🧩</div>
            <h3>Tetris</h3>
        </a>

        <!-- Jogo 7 -->
        <a href="https://plays.org/space-invaders/" target="_blank" class="cartao-jogo">
            <div class="icone-jogo">👾</div>
            <h3>Space Invaders</h3>
        </a>

        <!-- Jogo 8 -->
        <a href="https://www.google.com/logos/2012/darts12-hp.html" target="_blank" class="cartao-jogo">
            <div class="icone-jogo">🎯</div>
            <h3>Dardos</h3>
        </a>

        <!-- Jogo 9 -->
        <a href="https://plays.org/tic-tac-toe/" target="_blank" class="cartao-jogo">
            <div class="icone-jogo">❌⭕</div>
            <h3>Jogo da Velha</h3>
        </a>

        <!-- Jogo 10 (Termo) -->
        <a href="https://term.ooo/" target="_blank" class="cartao-jogo">
            <div class="icone-jogo">📝</div>
            <h3>Termo</h3>
        </a>

        <!-- Jogo 11 (Campo Minado) -->
        <a href="https://minesweeper.online/pt/" target="_blank" class="cartao-jogo">
            <div class="icone-jogo">💣</div>
            <h3>Campo Minado</h3>
        </a>

        <!-- Jogo 12 (Jogo da Memória) -->
        <a href="https://plays.org/memory/" target="_blank" class="cartao-jogo">
            <div class="icone-jogo">🃏</div>
            <h3>Jogo da Memória</h3>
        </a>

        <!-- Jogo 13 (Doodle Jump) -->
        <a href="https://plays.org/doodle-jump/" target="_blank" class="cartao-jogo">
            <div class="icone-jogo">☁️</div>
            <h3>Doodle Jump</h3>
        </a>

    </div>

</body>
</html>
