<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portal de Jogos</title>
    <style>
        /* Configurações gerais do visual */
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #e94560;
        }
        
        /* A grade onde os jogos ficam */
        .grade-jogos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* O cartão de cada jogo */
        .cartao-jogo {
            background-color: #16213e;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            transition: transform 0.2s;
            border: 2px solid transparent;
        }

        .cartao-jogo:hover {
            transform: scale(1.05);
            border: 2px solid #e94560;
        }

        .cartao-jogo img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .cartao-jogo h3 {
            margin: 10px 0;
            font-size: 16px;
        }

        .cartao-jogo a {
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body>

    <h1>🎮 Meu Portal de Jogos 🎮</h1>
    
    <div class="grade-jogos">
        
        <!-- Jogo 1 -->
        <div class="cartao-jogo">
            <a href="https://play2048.co/" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/18/2048_logo.svg" alt="2048">
                <h3>2048</h3>
            </a>
        </div>

        <!-- Jogo 2 -->
        <div class="cartao-jogo">
            <a href="https://hextris.io/" target="_blank">
                <img src="https://hextris.io/images/hextris-logo.png" alt="Hextris" style="background-color: white;">
                <h3>Hextris</h3>
            </a>
        </div>

        <!-- Jogo 3 -->
        <div class="cartao-jogo">
            <a href="https://clarkduvall.com/snake/" target="_blank">
                <div style="font-size: 50px; padding-top: 20px;">🐍</div>
                <h3>Snake</h3>
            </a>
        </div>

        <!-- Jogo 4 -->
        <div class="cartao-jogo">
            <a href="https://trex-runner.com/" target="_blank">
                <div style="font-size: 50px; padding-top: 20px;">🦖</div>
                <h3>T-Rex Run</h3>
            </a>
        </div>

    </div>

</body>
</html>
